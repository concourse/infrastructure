---
# This is manually deployed.

name: bosh-worker

releases:
  # https://bosh.io/releases/github.com/concourse/concourse-bosh-release
  - name: "concourse"
    version: "8.2.3"
    url: "https://bosh.io/d/github.com/concourse/concourse-bosh-release?v=8.2.3"
    sha1: sha256:655f798149d35fa1fca5811479d1e0d7488f009b43c9b811b92c6d68186c9dd4

stemcells:
  - alias: jammy
    os: ubuntu-jammy
    version: latest

instance_groups:
  - name: bosh-worker
    instances: 1
    vm_type: medium
    vm_extensions:
      - 500GB_ephemeral_disk
      # Custom vm_extension in the cloud-config that applies a tag to allow
      # network access between the worker and the bosh director.
      - bosh-open
    stemcell: jammy
    azs: [z1]
    networks:
      - name: default
    jobs:
      - name: worker
        release: concourse
        properties:
          team: main
          tags: [bosh]

          runtime: containerd
          baggageclaim:
            driver: overlay

          drain_timeout: 10m

          worker_gateway:
            hosts: ["ci.concourse-ci.org:2222"]
            rebalance_interval: 2h

            # manually entered into credhub and using the same values from the workers on k8s
            # credhub set -n /bosh-{bbl env-id}/{deployment name}/worker_key -t rsa -p private_key_file -u pub_key_file
            # credhub set -n /bosh-{bbl env-id}/{deployment name}/host_public_key -t value -v 'host_public_key_value'
            host_public_key: ((host_public_key))
            worker_key: ((worker_key))

update:
  canaries: 1
  canary_watch_time: 1000-60000
  max_in_flight: 2
  serial: false
  update_watch_time: 1000-60000
